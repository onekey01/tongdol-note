      (function () {
        var saved = localStorage.getItem('theme') || 'light'; // 기본은 밝게
        var dark =
          saved === 'dark' ||
          (saved === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);

        // 글자 크기도 '그려지기 전에' 정합니다.

        document.documentElement.style.fontSize =
          (sizes[localStorage.getItem('fontSize')] || 16) + 'px';
      })();
